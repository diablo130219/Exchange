<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0A08;
    --surface:#161310;
    --surface-2:#1F1A14;
    --border:#2C2418;
    --border-strong:#43371F;
    --text:#F5EFE2;
    --text-muted:#B4A98F;
    --text-faint:#7A705C;
    --gold:#D9B44A;
    --gold-bright:#F0CD6E;
    --gold-deep:#8A6D22;
    --win:#3FBE6B;
    --win-soft:#12291B;
    --giallo:#E8C13B;
    --giallo-soft:#332A0E;
    --rosso:#E15C4D;
    --rosso-soft:#331611;
    --neutro:#9AA1AF;
    --neutro-soft:#1E2027;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 14px 34px -14px rgba(0,0,0,.8);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at top, #17130d 0%, var(--bg) 55%);color:var(--text);font-family:'Sora',ui-sans-serif,system-ui,sans-serif;min-height:100vh;}
  a{color:inherit;}
  ::selection{background:var(--gold-deep);color:#fff;}

  .navbar{display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:10px;}
  .brand{font-family:'Playfair Display',serif;font-weight:800;font-size:1.4rem;letter-spacing:.02em;color:var(--gold-bright);}
  .brand span{color:var(--text);}
  .navlinks{display:flex;gap:22px;font-size:.82rem;color:var(--text-muted);flex-wrap:wrap;}
  .navlinks a{text-decoration:none;}
  .navlinks a:hover{color:var(--gold-bright);}
  .navlinks a.active{color:var(--gold-bright);font-weight:600;}

  .hero{padding:46px 28px 30px;text-align:center;background:linear-gradient(180deg, rgba(217,180,74,.08), transparent 70%);}
  .hero h1{font-family:'Playfair Display',serif;font-size:2.1rem;margin:0 0 10px;font-weight:800;}
  .hero h1 .gold{color:var(--gold-bright);}
  .hero p{color:var(--text-muted);font-size:.92rem;max-width:520px;margin:0 auto;}

  .wrap{max-width:1100px;margin:0 auto;padding:0 20px 70px;}
  .section-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:28px 0 16px;}
  .section-head h2{font-size:1.05rem;margin:0;letter-spacing:.03em;text-transform:uppercase;color:var(--text);}
  .section-head h2 small{display:block;text-transform:none;letter-spacing:0;color:var(--text-faint);font-size:.74rem;font-weight:400;margin-top:2px;}
  .refresh-note{font-size:.7rem;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}

  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .pill{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);font-size:.76rem;padding:7px 14px;border-radius:999px;cursor:pointer;font-family:inherit;}
  .pill.active{background:var(--surface-2);border-color:var(--gold-deep);color:var(--gold-bright);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 17px;box-shadow:var(--shadow);}
  .card.esito-entrata_vinta{border-color:var(--win);box-shadow:0 0 0 1px var(--win) inset, var(--shadow);}
  .card.esito-entrata_persa{border-color:var(--rosso);box-shadow:0 0 0 1px var(--rosso) inset, var(--shadow);}
  .card.esito-non_entrata{border-color:var(--giallo);box-shadow:0 0 0 1px var(--giallo) inset, var(--shadow);}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .when{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--text-muted);}
  .league{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--gold);margin-top:3px;font-weight:600;}
  .teams-row{display:flex;align-items:center;gap:10px;margin:14px 0 10px;}
  .crest{width:30px;height:30px;border-radius:50%;object-fit:contain;background:var(--surface-2);flex:none;}
  .crest.placeholder{display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;color:var(--text-faint);border:1px solid var(--border);}
  .teams-names{font-size:.95rem;font-weight:700;line-height:1.35;}
  .vs{color:var(--text-faint);font-weight:400;font-size:.8rem;}
  .meta-row{display:flex;flex-direction:column;gap:5px;font-size:.8rem;color:var(--text-muted);margin-bottom:14px;}
  .meta-row b{color:var(--text);font-weight:600;}
  .esito-banner{text-align:center;font-size:.76rem;font-weight:700;letter-spacing:.03em;padding:9px 10px;border-radius:8px;text-transform:uppercase;}
  .esito-banner.entrata_vinta{background:var(--win-soft);color:var(--win);}
  .esito-banner.entrata_persa{background:var(--rosso-soft);color:var(--rosso);}
  .esito-banner.non_entrata{background:var(--giallo-soft);color:var(--giallo);}
  .esito-banner.attesa{background:var(--neutro-soft);color:var(--neutro);}
  .empty{grid-column:1/-1;color:var(--text-faint);font-style:italic;padding:50px 0;text-align:center;}

  @media(max-width:560px){ .navlinks{display:none;} }
</style>
</head>
<body>

<div class="navbar">
  <div class="brand">Easy<span>Bet</span></div>
  <div class="navlinks">
    <a href="#" class="active">Home</a>
    <a href="#">Pronostici</a>
    <a href="#">Live</a>
    <a href="#">Statistiche</a>
    <a href="#">Strategie</a>
    <a href="#">Consigli</a>
  </div>
</div>

<div class="hero">
  <h1>Le mie <span class="gold">giocate</span>.</h1>
  <p>Partite selezionate a mano, con quota d'ingresso ed esito.</p>
</div>

<div class="wrap">
  <div class="section-head">
    <h2>Partite<small>Aggiornato automaticamente.</small></h2>
    <div class="refresh-note" id="refreshNote">aggiornamento…</div>
  </div>

  <div class="pills" id="pills">
    <button class="pill active" data-f="tutte">Tutte</button>
    <button class="pill" data-f="entrata_vinta">Vinte</button>
    <button class="pill" data-f="entrata_persa">Perse</button>
    <button class="pill" data-f="non_entrata">Non entrate</button>
    <button class="pill" data-f="">In attesa</button>
  </div>

  <div class="grid" id="grid"><div class="empty">Caricamento…</div></div>
</div>

<script>
(function(){
  var ESITO_LABEL = {
    entrata_vinta: 'Entrata • Vinta',
    entrata_persa: 'Entrata • Persa',
    non_entrata: 'Non entrata'
  };

  var crestCache = {};
  var matches = [];
  var currentFilter = 'tutte';

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function initials(name){
    var parts = String(name||'').trim().split(/\s+/);
    var s = (parts[0]||'')[0] || '?';
    return s.toUpperCase();
  }

  function crestImg(name){
    var id = 'crest-' + Math.random().toString(36).slice(2);
    setTimeout(function(){ loadCrest(name, id); }, 0);
    return '<span class="crest placeholder" id="'+id+'">'+esc(initials(name))+'</span>';
  }

  function loadCrest(name, id){
    var key = String(name||'').trim().toLowerCase();
    if (!key) return;
    if (crestCache[key] !== undefined){ applyCrest(id, crestCache[key]); return; }
    fetch('/api/team-crest?name=' + encodeURIComponent(name))
      .then(function(r){ return r.json(); })
      .then(function(d){
        crestCache[key] = d && d.url ? d.url : null;
        applyCrest(id, crestCache[key]);
      })
      .catch(function(){ crestCache[key] = null; });
  }

  function applyCrest(id, url){
    var el = document.getElementById(id);
    if (!el || !url) return;
    var img = document.createElement('img');
    img.className = 'crest';
    img.src = url;
    img.alt = '';
    el.replaceWith(img);
  }

  function fmtWhen(m){
    var d = new Date(Number(m.startAt));
    var dd = (m.data || d.toLocaleDateString('it-IT'));
    var oo = (m.ora || d.toLocaleTimeString('it-IT', {hour:'2-digit', minute:'2-digit'}));
    return dd + ' ' + oo;
  }

  function matchesFilter(m){
    if (currentFilter === 'tutte') return true;
    return (m.esitoManuale || '') === currentFilter;
  }

  function render(){
    var grid = document.getElementById('grid');
    var list = matches.filter(matchesFilter);
    if (!list.length){
      grid.innerHTML = '<div class="empty">Nessuna partita in questa vista.</div>';
      return;
    }
    grid.innerHTML = list.map(function(m){
      var esito = m.esitoManuale || '';
      var cls = 'card' + (esito ? ' esito-'+esito : '');
      var bannerCls = esito ? esito : 'attesa';
      var bannerLabel = esito ? ESITO_LABEL[esito] : 'In attesa';
      return '<div class="'+cls+'">'+
        '<div class="card-top">'+
          '<span class="when">'+esc(fmtWhen(m))+'</span>'+
        '</div>'+
        (m.campionato? '<div class="league">'+esc(m.campionato)+'</div>' : '')+
        '<div class="teams-row">'+
          crestImg(m.casa)+
          '<div class="teams-names">'+esc(m.casa)+' <span class="vs">vs</span> '+esc(m.trasferta)+'</div>'+
        '</div>'+
        '<div class="meta-row">'+
          (m.tipoGiocata? '<div>Strategia: <b>'+esc(m.tipoGiocata)+'</b></div>' : '')+
          (m.quotaIngresso? '<div>Quota ingresso: <b>'+esc(m.quotaIngresso)+'</b></div>' : '')+
        '</div>'+
        '<div class="esito-banner '+bannerCls+'">'+esc(bannerLabel)+'</div>'+
      '</div>';
    }).join('');
  }

  function loadMatches(){
    return fetch('/api/state').then(function(r){ return r.json(); }).then(function(s){
      matches = (s.matches || []).slice().sort(function(a,b){ return a.startAt - b.startAt; });
      render();
      document.getElementById('refreshNote').textContent = 'aggiornato alle ' + new Date().toLocaleTimeString('it-IT');
    }).catch(function(){
      document.getElementById('refreshNote').textContent = 'errore di aggiornamento';
    });
  }

  document.getElementById('pills').addEventListener('click', function(e){
    var btn = e.target.closest('.pill');
    if (!btn) return;
    currentFilter = btn.getAttribute('data-f');
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    render();
  });

  loadMatches();
  setInterval(loadMatches, 15000);
})();
</script>
</body>
</html>
