<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070707;font-family:'Sora',sans-serif;color:var(--text)}

.page-shell{width:min(1500px,calc(100vw - 24px));margin:10px auto 28px;background:var(--bg);border-radius:34px 34px 0 0;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.28)}

.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#3b301a,#16120c);border:1px solid rgba(242,208,110,.28);color:var(--gold2);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.brand-copy{line-height:1}.brand-copy strong{font-size:1.28rem}.brand-copy strong span{color:var(--gold2)}.brand-copy small{display:block;margin-top:4px;color:#8d8473;font-size:.57rem;letter-spacing:.24em}
.nav{display:flex;justify-content:center;gap:24px}.nav a{font-size:.78rem;color:#c3baa8;font-weight:600;padding:28px 0 24px;position:relative}.nav a.active,.nav a:hover{color:#fff}.nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.nav-actions{display:flex;justify-content:flex-end;gap:10px}.nav-btn{padding:11px 19px;border-radius:10px;font-size:.76rem;font-weight:700;border:1px solid rgba(242,208,110,.28);background:#0f0f0e;color:#fff}.nav-btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1407;box-shadow:0 8px 22px rgba(216,173,61,.2)}.mobile-menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(242,208,110,.28);background:#0f0f0e;color:var(--gold2);font-size:1.2rem;font-weight:800;align-items:center;justify-content:center;cursor:pointer}.mobile-nav{display:none;background:#0b0b0a;border-top:1px solid rgba(242,208,110,.12);border-bottom:1px solid rgba(242,208,110,.12);padding:10px 14px 12px}.mobile-nav.open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.mobile-nav a{display:flex;align-items:center;justify-content:center;min-height:46px;padding:10px;border-radius:12px;border:1px solid #2b271f;background:#11100e;color:#d8cfbe;font-size:.8rem;font-weight:700}.mobile-nav a.active,.mobile-nav a:hover{color:#171105;background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:var(--gold)}
.hero{position:relative;background:#0a0907}.hero img{width:100%;display:block;height:500px;object-fit:cover;object-position:center center}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(180deg,transparent,#080807)}
.section{padding:14px 24px 34px;background:linear-gradient(180deg,#090909,#060606)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0 12px}.title-wrap{display:flex;align-items:center;gap:12px}.accent-line{width:6px;height:34px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 18px rgba(242,208,110,.24)}
.section-head h2{margin:0;font-size:1.16rem;letter-spacing:.01em}.section-head p{margin:3px 0 0;color:#9a9180;font-size:.72rem;letter-spacing:.05em}.refresh{font-size:.7rem;color:#7f7768}
.toolbar{display:flex;justify-content:flex-end;margin:0 0 16px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #2d2921;background:#0e0e0d;color:#aaa18f;border-radius:10px;padding:8px 13px;font-size:.72rem;font-weight:700;cursor:pointer}.pill.active{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1307;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,290px));justify-content:flex-start;gap:16px}.grid.home-history{display:block}.date-group{margin:0 0 28px;padding:16px 18px 18px;border:1px solid rgba(243,210,113,.12);border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.018),rgba(255,255,255,.006));box-shadow:0 14px 34px rgba(0,0,0,.16)}.date-group-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:0;color:#f3d271;font-size:.82rem;font-weight:900;letter-spacing:.10em;text-transform:uppercase}.date-group-head:before{content:'✦';display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:rgba(243,210,113,.10);border:1px solid rgba(243,210,113,.22);font-size:.72rem}.date-group-head:after{content:'';height:1px;flex:1;background:linear-gradient(90deg,rgba(243,210,113,.42),transparent)}.date-group-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,290px));justify-content:flex-start;gap:16px}.date-group.archive{display:block;width:100%;box-sizing:border-box;margin:0 0 12px;padding:0;border:1px solid rgba(243,210,113,.18);border-radius:18px;background:linear-gradient(180deg,rgba(243,210,113,.045),rgba(255,255,255,.008));overflow:hidden;box-shadow:none}.date-group.archive summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px;padding:14px 16px;color:#e4dccd;font-size:.80rem;font-weight:800;letter-spacing:.02em;transition:.2s ease}.date-group.archive summary:hover{background:rgba(243,210,113,.05)}.date-group.archive summary::-webkit-details-marker{display:none}.date-group.archive summary:after{content:'+';flex:0 0 34px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;border:1px solid rgba(243,210,113,.28);background:rgba(243,210,113,.08);color:#f3d271;font-size:1.15rem;font-weight:700}.date-group.archive[open] summary{border-bottom:1px solid rgba(243,210,113,.14)}.date-group.archive[open] summary:after{content:'−'}.date-group.archive .date-group-grid{padding:16px}.archive-label{display:flex;align-items:center;gap:12px;min-width:0}.archive-label:before{content:'▣';color:#d8ad3d;font-size:1rem}.archive-count{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;background:rgba(243,210,113,.08);border:1px solid rgba(243,210,113,.14);color:#9f9584;font-weight:700;font-size:.65rem;letter-spacing:0;text-transform:none}.card{position:relative;overflow:hidden;min-height:405px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#12110f,#0b0c0b);border:1px solid rgba(214,170,58,.38);box-shadow:0 0 0 1px rgba(214,170,58,.08) inset,0 18px 30px rgba(0,0,0,.28)}.card:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(32,159,67,.26),transparent 33%),linear-gradient(180deg,rgba(255,255,255,.035),transparent 28%);pointer-events:none}.card:after{content:'';position:absolute;left:12px;right:12px;bottom:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(243,210,113,.7),transparent);opacity:.9}.card.esito-entrata_vinta{border-color:#1ef267;box-shadow:0 0 0 1px rgba(30,242,103,.35) inset,0 0 22px rgba(30,242,103,.35),0 18px 30px rgba(0,0,0,.30)}.card.esito-entrata_persa{border-color:#ff554f;box-shadow:0 0 0 1px rgba(255,85,79,.30) inset,0 0 20px rgba(255,85,79,.24),0 18px 30px rgba(0,0,0,.30)}.card.esito-non_entrata{border-color:#ffd34f;box-shadow:0 0 0 1px rgba(255,211,79,.30) inset,0 0 20px rgba(255,211,79,.24),0 18px 30px rgba(0,0,0,.30)}
.card-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.league{font-weight:800;font-size:.86rem;line-height:1.1}.league small{display:block;color:#b7ad99;font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:5px}.time{padding:9px 11px;border-radius:14px;background:rgba(21,22,19,.88);border:1px solid rgba(255,255,255,.08);text-align:right;min-width:74px}.time small{display:block;font-size:.56rem;color:#958d7d;text-transform:uppercase;letter-spacing:.12em}.time strong{font-size:1rem}.date{position:relative;z-index:1;color:#938877;font-size:.68rem}
.matchup{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 8px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.05)}.team{text-align:center}.role{font-size:.58rem;text-transform:uppercase;letter-spacing:.16em;color:#b7ad99;margin-bottom:8px}.crest-wrap{width:84px;height:84px;border-radius:18px;margin:0 auto 8px;display:grid;place-items:center;background:rgba(14,14,13,.82);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.crest{width:64px;height:64px;object-fit:contain}.crest.placeholder{display:grid;place-items:center;color:#d8c39b;font-weight:800;font-size:1rem}.team-name{font-size:.92rem;font-weight:800}.vs{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-weight:800;box-shadow:0 6px 14px rgba(216,173,61,.22)}

.status{position:relative;z-index:1;margin-top:auto;padding:10px 14px;border-radius:14px;text-transform:uppercase;border:1px solid;display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px}.status-icon{font-size:1.7rem;line-height:1}.status-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1}.status-copy small{font-size:.55rem;letter-spacing:.18em;opacity:.95;margin-bottom:4px}.status-copy strong{font-size:1rem;letter-spacing:.02em}.status.entrata_vinta{color:#18ff63;background:linear-gradient(180deg,rgba(4,90,33,.90),rgba(7,71,28,.96));border-color:rgba(30,242,103,.92);box-shadow:inset 0 0 0 1px rgba(30,242,103,.22),0 0 18px rgba(30,242,103,.24)}.status.entrata_persa{color:#ffd9d8;background:linear-gradient(180deg,rgba(120,19,18,.92),rgba(94,13,12,.96));border-color:rgba(255,85,79,.92);box-shadow:inset 0 0 0 1px rgba(255,85,79,.18),0 0 16px rgba(255,85,79,.22)}.status.non_entrata{color:#ffe8a2;background:linear-gradient(180deg,rgba(112,87,14,.92),rgba(94,70,9,.96));border-color:rgba(255,211,79,.92);box-shadow:inset 0 0 0 1px rgba(255,211,79,.18),0 0 16px rgba(255,211,79,.20)}.status.attesa{color:#eef2f8;background:linear-gradient(180deg,rgba(58,63,74,.62),rgba(44,48,56,.74));border-color:rgba(170,177,188,.38)}.empty{grid-column:1/-1;text-align:center;color:#847b6b;padding:50px}
@media(max-width:900px){.page-shell{width:min(100vw - 16px,100vw - 16px);margin:8px auto 20px}.topbar{grid-template-columns:1fr auto auto;height:auto;padding:12px 16px}.nav{display:none}.mobile-menu-btn{display:flex}.hero img{height:320px;object-fit:cover;object-position:center center}.section{padding:12px 14px 28px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));justify-content:stretch}.date-group-grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));justify-content:stretch}.nav-actions{gap:6px}.nav-btn{padding:9px 12px}}
@media(max-width:560px){body{background:#070707}.page-shell{width:100%;margin:0;border-radius:0}.topbar{grid-template-columns:1fr auto auto;padding:12px}.brand-copy small{display:none}.nav-actions .nav-btn:first-child{display:none}.nav-actions .nav-btn.primary{padding:10px 14px}.mobile-menu-btn{width:42px;height:42px}.mobile-nav.open{grid-template-columns:1fr 1fr;padding:10px 12px 12px}.hero img{height:220px;object-position:center center}.toolbar{justify-content:flex-start}.pills{width:100%}.pill{flex:1}.grid{grid-template-columns:1fr}.date-group-grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}

.stats-dashboard{display:none;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:6px}.stats-dashboard.show{display:grid}.stat-box{grid-column:span 3;background:linear-gradient(180deg,#141310,#0c0c0b);border:1px solid #2c2922;border-radius:18px;padding:18px;box-shadow:0 12px 28px rgba(0,0,0,.22)}.stat-box .stat-label{font-size:.68rem;color:#978e7e;text-transform:uppercase;letter-spacing:.12em}.stat-box .stat-value{font-size:2rem;font-weight:800;margin-top:8px}.stat-box .stat-foot{font-size:.72rem;color:#8d8474;margin-top:6px}.stat-box.win{border-color:rgba(36,216,108,.34)}.stat-box.win .stat-value{color:var(--green)}.stat-box.loss{border-color:rgba(255,75,69,.34)}.stat-box.loss .stat-value{color:var(--red)}.stat-box.skip{border-color:rgba(240,200,60,.34)}.stat-box.skip .stat-value{color:var(--yellow)}.stat-box.rate{border-color:rgba(243,210,113,.34)}.stat-box.rate .stat-value{color:var(--gold2)}.chart-box{grid-column:span 6;background:linear-gradient(180deg,#12110f,#0b0b0a);border:1px solid #2b271f;border-radius:20px;padding:18px;min-height:320px}.chart-title{font-size:.92rem;font-weight:800}.chart-sub{font-size:.7rem;color:#8c8373;margin-top:3px}.donut-wrap{display:flex;align-items:center;justify-content:center;gap:26px;height:250px;flex-wrap:wrap}.donut{width:190px;height:190px;border-radius:50%;position:relative;background:conic-gradient(var(--green) 0 var(--winPct,0%),var(--red) var(--winPct,0%) calc(var(--winPct,0%) + var(--lossPct,0%)),var(--yellow) calc(var(--winPct,0%) + var(--lossPct,0%)) 100%);box-shadow:0 0 28px rgba(0,0,0,.35)}.donut:after{content:'';position:absolute;inset:31px;border-radius:50%;background:#0e0e0d;border:1px solid #26231d}.donut-center{position:absolute;inset:0;display:grid;place-items:center;z-index:2;text-align:center}.donut-center strong{font-size:1.7rem}.donut-center span{font-size:.62rem;color:#8f8778;text-transform:uppercase;letter-spacing:.1em}.chart-legend{display:flex;flex-direction:column;gap:12px;min-width:170px}.chart-legend-row{display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:.78rem}.chart-legend-row span:first-child{display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%}.dot.g{background:var(--green)}.dot.r{background:var(--red)}.dot.y{background:var(--yellow)}.trend-wrap{height:250px;margin-top:14px;position:relative}.trend-svg{width:100%;height:100%;overflow:visible}.trend-grid{stroke:rgba(255,255,255,.08);stroke-width:1}.trend-line{fill:none;stroke:var(--gold2);stroke-width:3;filter:drop-shadow(0 0 6px rgba(243,210,113,.28))}.trend-area{fill:url(#trendArea)}.trend-point{fill:var(--gold2);stroke:#120f09;stroke-width:2}.trend-labels{display:flex;justify-content:space-between;color:#756d60;font-size:.62rem;margin-top:6px}.stats-note{grid-column:1/-1;color:#8f8676;font-size:.72rem;line-height:1.5;padding:0 2px}.stats-empty{grid-column:1/-1;padding:55px;text-align:center;border:1px dashed #332d22;border-radius:18px;color:#857c6e}@media(max-width:900px){.stat-box{grid-column:span 6}.chart-box{grid-column:1/-1}}@media(max-width:560px){.stat-box{grid-column:1/-1}.donut-wrap{height:auto;padding:18px 0}.chart-box{min-height:290px}}

.strategies-board{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:8px}.strategies-board.show{display:grid}.strategy-card{position:relative;overflow:hidden;border-radius:22px;border:1px solid rgba(243,210,113,.28);background:linear-gradient(180deg,#12110f,#0b0b0a);box-shadow:0 18px 36px rgba(0,0,0,.24);padding:20px}.strategy-card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 95% 0,rgba(216,173,61,.12),transparent 28%);pointer-events:none}.strategy-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:16px}.strategy-badge{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border-radius:999px;border:1px solid rgba(243,210,113,.26);background:rgba(216,173,61,.08);font-size:.64rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}.strategy-window{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:#978d7a;background:#171613;border:1px solid #2b281f;padding:7px 9px;border-radius:10px}.strategy-card h3{position:relative;z-index:1;margin:0 0 8px;font-size:1.15rem;line-height:1.15}.strategy-intro{position:relative;z-index:1;margin:0 0 16px;color:#b9af9d;font-size:.83rem;line-height:1.65}.strategy-rule{position:relative;z-index:1;border:1px solid rgba(243,210,113,.18);background:linear-gradient(180deg,rgba(216,173,61,.08),rgba(216,173,61,.03));border-radius:16px;padding:13px 14px;margin-bottom:14px}.strategy-rule small{display:block;color:#a99e8a;font-size:.58rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:6px}.strategy-rule strong{display:block;color:#fff;font-size:.88rem;line-height:1.5}.strategy-metrics{position:relative;z-index:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}.metric-chip{border:1px solid #29261f;background:#141310;border-radius:13px;padding:10px}.metric-chip span{display:block;color:#8f8676;font-size:.57rem;text-transf       adviceCard('📈','Quota e qualità del match','Una quota più alta può migliorare il rapporto rischio/rendimento, ma non trasforma un match debole in un buon ingresso.',['Prima viene la qualità del live, poi la quota.','Una quota bassa non giustifica statistiche incomplete.','Una quota alta richiede comunque un motivo concreto per aspettarsi l’evento.'],'wide')+
      '<div class="five-rules"><h3>5 regole EasyBet</h3><div class="rules-grid"><div class="rule-item"><b>01</b><span>Non entrare solo perché la quota è arrivata.</span></div><div class="rule-item"><b>02</b><span>Le statistiche devono raccontare tutte la stessa partita.</span></div><div class="rule-item"><b>03</b><span>Più passa il tempo, più serve qualità nei dati.</span></div><div class="rule-item"><b>04</b><span>Meglio saltare un ingresso che forzarne uno.</span></div><div class="rule-item"><b>05</b><span>Valuta una strategia sul lungo periodo, non sul singolo risultato.</span></div></div></div>'+
      '<div class="semaforo"><div class="signal green"><strong>● Verde — condizioni coerenti</strong><p>Più indicatori importanti concordano: produzione offensiva, pressione recente, quota e situazione di punteggio.</p></div><div class="signal yellow"><strong>● Giallo — manca conferma</strong><p>La partita ha segnali interessanti, ma uno o più dati decisivi sono ancora deboli. Aspettare può migliorare la decisione.</p></div><div class="signal red"><strong>● Rosso — niente ingresso</strong><p>Ritmo basso, numeri insufficienti o contesto sfavorevole. La quota non deve diventare una scusa per entrare.</p></div></div>'+
      '<div class="responsible"><b>Nota:</b> questi contenuti descrivono un metodo di lettura e registrazione delle strategie, non garantiscono risultati. Usa un budget dedicato, limiti definiti e non inseguire le perdite.</div>';
  }
  function adviceCard(icon,title,copy,items,extra){
    return '<article class="advice-card '+(extra||'')+'"><div class="advice-icon">'+icon+'</div><h3>'+esc(title)+'</h3><p>'+esc(copy)+'</p><ul>'+items.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></article>';
  }

  function renderMatchCard(m){
      var e=m.esitoManuale||'',status=e?e:'attesa',camp=esc(m.campionato||'Campionato'),q=esc(m.quotaIngresso||'—'),str=esc(m.tipoGiocata||'Da definire');
      var icon,label;
      if(e){icon=ESITO_ICON[e];label=ESITO_LABEL[e]}
      else if(currentView==='live'){icon='●';label='Live'}
      else{icon='⏱';label='Da iniziare'}
      return '<article class="card'+(e?' esito-'+e:'')+'"><div class="card-head"><div class="league"><small>Campionato</small>'+camp+'</div><div class="time"><small>Ora</small><strong class="num">'+esc(fmtTime(m))+'</strong></div></div><div class="date num">'+esc(fmtDate(m))+'</div><div class="matchup"><div class="team"><div class="role">Casa</div>'+crestImg(m.casa,m.campionato)+'<div class="team-name">'+esc(m.casa||'Squadra casa')+'</div></div><div class="vs">VS</div><div class="team"><div class="role">Trasferta</div>'+crestImg(m.trasferta,m.campionato)+'<div class="team-name">'+esc(m.trasferta||'Squadra trasferta')+'</div></div></div><div class="info-grid"><div class="info"><label>Quota ingresso</label><strong class="num">'+q+'</strong></div><div class="info strategy"><label>Strategia</label><strong>'+str+'</strong></div></div><div class="status '+status+'"><span class="status-icon">'+icon+'</span><span class="status-copy"><small>'+ (e?'Esito':currentView==='live'?'Stato':'Stato') +'</small><strong>'+esc(label)+'</strong></span></div></article>'
    }
  function renderFinishedByDate(list,grid){
    var groups={};
    list.slice().sort(function(a,b){return Number(b.startAt)-Number(a.startAt)}).forEach(function(m){var k=dayKey(m);(groups[k]||(groups[k]=[])).push(m)});
    var now=new Date(),today=localDayKey(now),yd=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1),yesterday=localDayKey(yd);
    var html='';
    [today,yesterday].forEach(function(k){
      if(!groups[k])return;
      html+='<section class="date-group recent"><div class="date-group-head">'+relativeDateLabel(k)+'</div><div class="date-group-grid">'+groups[k].map(renderMatchCard).join('')+'</div></section>';
      delete groups[k];
    });
    var archiveKeys=Object.keys(groups).sort().reverse();
    if(archiveKeys.length){
      html+='<div class="archive-title"><span></span>partite precedenti divise per data</div>';
      archiveKeys.forEach(function(k){
        var count=groups[k].length;
        html+='<details class="date-group archive"><summary><span class="archive-label"><span class="archive-date-text">'+esc(dateLabelFromKey(k))+'</span><span class="archive-count">'+count+' '+(count===1?'partita':'partite')+'</span></span></summary><div class="date-group-grid">'+groups[k].map(renderMatchCard).join('')+'</div></details>';
      });
    }
    grid.classList.add('home-history');
    grid.innerHTML=html||'<div class="empty">Nessuna partita terminata disponibile.</div>';
  }
  function render(){
    updateViewUI();
    var grid=document.getElementById('grid'),dash=document.getElementById('statsDashboard'),board=document.getElementById('strategiesBoard'),advice=document.getElementById('adviceBoard');
    board.classList.remove('show');board.innerHTML='';advice.classList.remove('show');advice.innerHTML='';
    if(currentView==='statistiche'){renderStats();return}
    if(currentView==='strategie'){renderStrategies();return}
    if(currentView==='consigli'){renderAdvice();return}
    dash.classList.remove('show');dash.innerHTML='';grid.style.display='grid';grid.classList.remove('home-history');
    var list=matches.filter(matchesView).filter(function(m){return currentView==='home'?matchesOutcomeFilter(m):true});
    if(!list.length){
      var empty=currentView==='pronostici'?'Nessun pronostico programmato.':currentView==='live'?'Nessuna partita live in questo momento.':'Nessuna partita terminata disponibile.';
      grid.innerHTML='<div class="empty">'+empty+'</div>';return;
    }
    if(currentView==='home'){renderFinishedByDate(list,grid);return}
    grid.innerHTML=list.map(renderMatchCard).join('')
  }
  function load(){fetch('/api/state').then(r=>r.json()).then(function(s){matches=(s.matches||[]).slice().sort(function(a,b){return Number(a.startAt)-Number(b.startAt)});render();document.getElementById('refreshNote').textContent='aggiornato alle '+new Date().toLocaleTimeString('it-IT')}).catch(function(){document.getElementById('refreshNote').textContent='errore di aggiornamento'})}
  function setView(view,scroll){
    currentView=view||'home';currentFilter='tutte';
    document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('active',p.getAttribute('data-f')==='tutte')});
    render();
    if(scroll) document.getElementById('partite').scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.querySelectorAll('[data-view]').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var v=a.getAttribute('data-view');if(!v)return;history.replaceState(null,'','#'+v);setView(v,true);if(mobileNav){mobileNav.classList.remove('open')}if(mobileMenuBtn){mobileMenuBtn.setAttribute('aria-expanded','false');mobileMenuBtn.textContent='☰'}})});
  document.getElementById('pills').addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;currentFilter=b.getAttribute('data-f');document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active')});b.classList.add('active');render()});
  var initial=(location.hash||'#home').replace('#','');if(['home','pronostici','live','statistiche','strategie','consigli'].indexOf(initial)<0)initial='home';currentView=initial;load();setInterval(load,15000);setInterval(function(){render()},30000)
})();
</script>
</body>
</html>
