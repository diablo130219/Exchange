<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBet — Live Match Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;--panel:#0d0d0c;--panel2:#12110f;--line:#2a2419;
  --text:#f5f2ea;--muted:#a9a08d;--gold:#d8ad3d;--gold2:#f3d271;
  --green:#24d86c;--red:#ff4b45;--yellow:#f0c83c;--neutral:#aab1bc;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070707;font-family:'Sora',sans-serif;color:var(--text)}
a{text-decoration:none;color:inherit}.num{font-family:'IBM Plex Mono',monospace}
.page-shell{width:min(1500px,calc(100vw - 24px));margin:10px auto 28px;background:var(--bg);border-radius:34px 34px 0 0;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.topbar{height:74px;display:grid;grid-template-columns:240px 1fr 280px;align-items:center;padding:0 24px;border-bottom:1px solid rgba(242,208,110,.14);background:linear-gradient(180deg,#0b0b0a,#080807)}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#3b301a,#16120c);border:1px solid rgba(242,208,110,.28);color:var(--gold2);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.brand-copy{line-height:1}.brand-copy strong{font-size:1.28rem}.brand-copy strong span{color:var(--gold2)}.brand-copy small{display:block;margin-top:4px;color:#8d8473;font-size:.57rem;letter-spacing:.24em}
.nav{display:flex;justify-content:center;gap:24px}.nav a{font-size:.78rem;color:#c3baa8;font-weight:600;padding:28px 0 24px;position:relative}.nav a.active,.nav a:hover{color:#fff}.nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.nav-actions{display:flex;justify-content:flex-end;gap:10px}.nav-btn{padding:11px 19px;border-radius:10px;font-size:.76rem;font-weight:700;border:1px solid rgba(242,208,110,.28);background:#0f0f0e;color:#fff}.nav-btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1407;box-shadow:0 8px 22px rgba(216,173,61,.2)}
.hero{position:relative;background:#0a0907}.hero img{width:100%;display:block;height:360px;object-fit:cover;object-position:center}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(180deg,transparent,#080807)}
.section{padding:14px 24px 34px;background:linear-gradient(180deg,#090909,#060606)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0 12px}.title-wrap{display:flex;align-items:center;gap:12px}.accent-line{width:6px;height:34px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 18px rgba(242,208,110,.24)}
.section-head h2{margin:0;font-size:1.16rem;letter-spacing:.01em}.section-head p{margin:3px 0 0;color:#9a9180;font-size:.72rem;letter-spacing:.05em}.refresh{font-size:.7rem;color:#7f7768}
.toolbar{display:flex;justify-content:flex-end;margin:0 0 16px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #2d2921;background:#0e0e0d;color:#aaa18f;border-radius:10px;padding:8px 13px;font-size:.72rem;font-weight:700;cursor:pointer}.pill.active{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1307;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{min-height:390px;display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:linear-gradient(180deg,#141310,#0d0d0c);border:1px solid #2b271f;box-shadow:0 12px 28px rgba(0,0,0,.20)}
.card.esito-entrata_vinta{border-color:rgba(36,216,108,.82);background:linear-gradient(180deg,rgba(36,216,108,.16),rgba(13,13,12,.98) 32%,rgba(13,13,12,.98));box-shadow:0 0 24px rgba(36,216,108,.14)}.card.esito-entrata_persa{border-color:rgba(255,75,69,.82);background:linear-gradient(180deg,rgba(255,75,69,.16),rgba(13,13,12,.98) 32%,rgba(13,13,12,.98));box-shadow:0 0 24px rgba(255,75,69,.14)}.card.esito-non_entrata{border-color:rgba(240,200,60,.82);background:linear-gradient(180deg,rgba(240,200,60,.16),rgba(13,13,12,.98) 32%,rgba(13,13,12,.98));box-shadow:0 0 24px rgba(240,200,60,.14)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.league{font-weight:800;font-size:.83rem}.league small{display:block;color:#8d8472;font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:3px}.time{padding:8px 10px;border-radius:11px;background:#191815;border:1px solid #2f2c25;text-align:right}.time small{display:block;font-size:.56rem;color:#817867;text-transform:uppercase;letter-spacing:.12em}.time strong{font-size:1rem}.date{color:#807766;font-size:.68rem}
.matchup{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 10px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01)),radial-gradient(circle at 50% 100%,rgba(38,118,37,.22),transparent 55%);border:1px solid rgba(255,255,255,.05)}.team{text-align:center}.role{font-size:.58rem;text-transform:uppercase;letter-spacing:.14em;color:#817867;margin-bottom:6px}.crest-wrap{width:74px;height:74px;border-radius:16px;margin:0 auto 8px;display:grid;place-items:center;background:#141412;border:1px solid rgba(255,255,255,.07)}.crest{width:56px;height:56px;object-fit:contain}.crest.placeholder{display:grid;place-items:center;color:#b6ad9d;font-weight:800;font-size:.95rem}.team-name{font-size:.88rem;font-weight:800}.vs{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-weight:800}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.info{background:#151411;border:1px solid #2c2922;border-radius:13px;padding:10px}.info label{font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:#817867}.info strong{display:block;margin-top:6px;font-size:1rem}.info.strategy strong{font-size:.86rem;line-height:1.22}
.status{margin-top:auto;padding:15px 12px;border-radius:14px;text-align:center;font-size:.90rem;font-weight:800;text-transform:uppercase;border:1px solid}.status.entrata_vinta{color:#0b1c10;background:linear-gradient(180deg,rgba(72,235,131,.92),rgba(31,180,90,.92));border-color:rgba(72,235,131,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}.status.entrata_persa{color:#280c0a;background:linear-gradient(180deg,rgba(255,110,102,.94),rgba(226,67,59,.94));border-color:rgba(255,110,102,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.status.non_entrata{color:#2b2207;background:linear-gradient(180deg,rgba(250,215,95,.94),rgba(235,191,50,.94));border-color:rgba(250,215,95,.95);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}.status.attesa{color:#eef2f8;background:linear-gradient(180deg,rgba(104,111,124,.46),rgba(66,72,84,.46));border-color:rgba(170,177,188,.38)}.empty{grid-column:1/-1;text-align:center;color:#847b6b;padding:50px}
@media(max-width:900px){.page-shell{width:min(100vw - 16px,100vw - 16px);margin:8px auto 20px}.topbar{grid-template-columns:1fr auto;height:auto;padding:12px 16px}.nav{display:none}.hero img{height:240px;object-fit:cover}.section{padding:12px 14px 28px}.grid{grid-template-columns:1fr}.nav-actions{gap:6px}.nav-btn{padding:9px 12px}}
@media(max-width:560px){body{background:#070707}.page-shell{width:100%;margin:0;border-radius:0}.brand-copy small{display:none}.nav-actions .nav-btn:first-child{display:none}.hero img{height:210px}.toolbar{justify-content:flex-start}.pills{width:100%}.pill{flex:1}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <a href="/easybet.html" class="brand">
      <div class="brand-mark">EB</div>
      <div class="brand-copy"><strong>Easy<span>Bet</span></strong><small>PLAY SMARTER</small></div>
    </a>
    <nav class="nav">
      <a class="active" href="#">Home</a><a href="#partite">Pronostici</a><a href="#partite">Live</a><a href="#partite">Statistiche</a><a href="#partite">Strategie</a><a href="#partite">Consigli</a><a href="#">Blog</a>
    </nav>
    <div class="nav-actions"><a class="nav-btn" href="/easybet-admin.html">Accedi</a><a class="nav-btn primary" href="#partite">Registrati</a></div>
  </header>

  <section class="hero" aria-label="EasyBet Live Match Tracker">
    <img src="/assets/easybet-hero-banner.png" alt="EasyBet Live Match Tracker con stadio e logo">
  </section>

  <section class="section" id="partite">
    <div class="section-head">
      <div class="title-wrap"><span class="accent-line"></span><div><h2>PARTITE INIZIATE</h2><p>SEGUI IN TEMPO REALE I NOSTRI PRONOSTICI</p></div></div>
      <div class="refresh num" id="refreshNote">aggiornamento…</div>
    </div>
    <div class="toolbar"><div class="pills" id="pills">
      <button class="pill active" data-f="tutte">Tutte</button>
      <button class="pill" data-f="entrata_vinta">● Vinte</button>
      <button class="pill" data-f="entrata_persa">● Perse</button>
      <button class="pill" data-f="non_entrata">● Non entrate</button>
      <button class="pill" data-f="">In attesa</button>
    </div></div>
    <div class="grid" id="grid"><div class="empty">Caricamento…</div></div>
  </section>
</div>
<script>
(function(){
  var ESITO_LABEL={entrata_vinta:'Entrati • Vinta',entrata_persa:'Entrati • Persa',non_entrata:'Non entrati'};
  var crestCache={},matches=[],currentFilter='tutte';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function initials(name){var p=String(name||'').trim().split(/\s+/);return (((p[0]||'')[0]||'?')+((p[1]||'')[0]||'')).toUpperCase()}
  function crestImg(name,campionato){var id='crest-'+Math.random().toString(36).slice(2);setTimeout(function(){loadCrest(name,campionato,id)},0);return '<span class="crest-wrap"><span class="crest placeholder" id="'+id+'">'+esc(initials(name))+'</span></span>'}
  function loadCrest(name,campionato,id){if(!String(name||'').trim())return;var key=String(name||'').trim().toLowerCase()+'|'+String(campionato||'').trim().toLowerCase();if(crestCache[key]!==undefined){applyCrest(id,crestCache[key]);return}var url='/api/team-crest?name='+encodeURIComponent(name)+(campionato?'&country='+encodeURIComponent(campionato):'');fetch(url).then(r=>r.json()).then(function(d){crestCache[key]=d&&d.url?d.url:null;applyCrest(id,crestCache[key])}).catch(function(){crestCache[key]=null})}
  function applyCrest(id,url){var el=document.getElementById(id);if(!el||!url)return;var img=document.createElement('img');img.className='crest';img.src=url;img.alt='';el.replaceWith(img)}
  function dt(v){var d=new Date(Number(v));return isNaN(d.getTime())?null:d}
  function fmtDate(m){if(m.data)return m.data;var d=dt(m.startAt);return d?d.toLocaleDateString('it-IT'):'—'}
  function fmtTime(m){if(m.ora)return m.ora;var d=dt(m.startAt);return d?d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'—'}
  function filterMatch(m){return currentFilter==='tutte'||(m.esitoManuale||'')===currentFilter}
  function render(){var grid=document.getElementById('grid'),list=matches.filter(filterMatch);if(!list.length){grid.innerHTML='<div class="empty">Nessuna partita disponibile in questa vista.</div>';return}grid.innerHTML=list.map(function(m){var e=m.esitoManuale||'',status=e?e:'attesa',camp=esc(m.campionato||'Campionato'),q=esc(m.quotaIngresso||'—'),str=esc(m.tipoGiocata||'Da definire');return '<article class="card'+(e?' esito-'+e:'')+'"><div class="card-head"><div class="league"><small>Campionato</small>'+camp+'</div><div class="time"><small>Ora</small><strong class="num">'+esc(fmtTime(m))+'</strong></div></div><div class="date num">'+esc(fmtDate(m))+'</div><div class="matchup"><div class="team"><div class="role">Casa</div>'+crestImg(m.casa,m.campionato)+'<div class="team-name">'+esc(m.casa||'Squadra casa')+'</div></div><div class="vs">VS</div><div class="team"><div class="role">Trasferta</div>'+crestImg(m.trasferta,m.campionato)+'<div class="team-name">'+esc(m.trasferta||'Squadra trasferta')+'</div></div></div><div class="info-grid"><div class="info"><label>Quota ingresso</label><strong class="num">'+q+'</strong></div><div class="info strategy"><label>Strategia</label><strong>'+str+'</strong></div></div><div class="status '+status+'">'+esc(e?ESITO_LABEL[e]:'In attesa')+'</div></article>'}).join('')}
  function load(){fetch('/api/state').then(r=>r.json()).then(function(s){matches=(s.matches||[]).slice().sort((a,b)=>Number(a.startAt)-Number(b.startAt));render();document.getElementById('refreshNote').textContent='aggiornato alle '+new Date().toLocaleTimeString('it-IT')}).catch(function(){document.getElementById('refreshNote').textContent='errore di aggiornamento'})}
  document.getElementById('pills').addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;currentFilter=b.getAttribute('data-f');document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));b.classList.add('active');render()});load();setInterval(load,15000)
})();
</script>
</body>
</html>
