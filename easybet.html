<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBet — Live Match Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070707;--panel:#0d0d0c;--panel2:#12110f;--line:#2a2419;
  --text:#f5f2ea;--muted:#a9a08d;--gold:#d8ad3d;--gold2:#f3d271;
  --green:#24d86c;--red:#ff4b45;--yellow:#f0c83c;--neutral:#aab1bc;
}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#070707;font-family:'Sora',sans-serif;color:var(--text)}
a{text-decoration:none;color:inherit}.num{font-family:'IBM Plex Mono',monospace}
.page-shell{width:min(1500px,calc(100vw - 24px));margin:10px auto 28px;background:var(--bg);border-radius:34px 34px 0 0;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.topbar{height:74px;display:grid;grid-template-columns:240px 1fr 280px;align-items:center;padding:0 24px;border-bottom:1px solid rgba(242,208,110,.14);background:linear-gradient(180deg,#0b0b0a,#080807)}
.brand{display:flex;align-items:center;gap:10px}.brand-mark{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,#3b301a,#16120c);border:1px solid rgba(242,208,110,.28);color:var(--gold2);font-weight:800;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}
.brand-copy{line-height:1}.brand-copy strong{font-size:1.28rem}.brand-copy strong span{color:var(--gold2)}.brand-copy small{display:block;margin-top:4px;color:#8d8473;font-size:.57rem;letter-spacing:.24em}
.nav{display:flex;justify-content:center;gap:24px}.nav a{font-size:.78rem;color:#c3baa8;font-weight:600;padding:28px 0 24px;position:relative}.nav a.active,.nav a:hover{color:#fff}.nav a.active:after{content:"";position:absolute;left:0;right:0;bottom:12px;height:2px;background:linear-gradient(90deg,transparent,var(--gold2),transparent)}
.nav-actions{display:flex;justify-content:flex-end;gap:10px}.nav-btn{padding:11px 19px;border-radius:10px;font-size:.76rem;font-weight:700;border:1px solid rgba(242,208,110,.28);background:#0f0f0e;color:#fff}.nav-btn.primary{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1b1407;box-shadow:0 8px 22px rgba(216,173,61,.2)}
.hero{position:relative;background:#0a0907}.hero img{width:100%;display:block;height:360px;object-fit:cover;object-position:center}.hero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:30px;background:linear-gradient(180deg,transparent,#080807)}
.section{padding:14px 24px 34px;background:linear-gradient(180deg,#090909,#060606)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 0 12px}.title-wrap{display:flex;align-items:center;gap:12px}.accent-line{width:6px;height:34px;border-radius:3px;background:linear-gradient(180deg,var(--gold2),var(--gold));box-shadow:0 0 18px rgba(242,208,110,.24)}
.section-head h2{margin:0;font-size:1.16rem;letter-spacing:.01em}.section-head p{margin:3px 0 0;color:#9a9180;font-size:.72rem;letter-spacing:.05em}.refresh{font-size:.7rem;color:#7f7768}
.toolbar{display:flex;justify-content:flex-end;margin:0 0 16px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{border:1px solid #2d2921;background:#0e0e0d;color:#aaa18f;border-radius:10px;padding:8px 13px;font-size:.72rem;font-weight:700;cursor:pointer}.pill.active{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1307;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,290px));justify-content:flex-start;gap:16px}.card{position:relative;overflow:hidden;min-height:405px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#12110f,#0b0c0b);border:1px solid rgba(214,170,58,.38);box-shadow:0 0 0 1px rgba(214,170,58,.08) inset,0 18px 30px rgba(0,0,0,.28)}.card:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(32,159,67,.26),transparent 33%),linear-gradient(180deg,rgba(255,255,255,.035),transparent 28%);pointer-events:none}.card:after{content:'';position:absolute;left:12px;right:12px;bottom:70px;height:1px;background:linear-gradient(90deg,transparent,rgba(243,210,113,.7),transparent);opacity:.9}.card.esito-entrata_vinta{border-color:#1ef267;box-shadow:0 0 0 1px rgba(30,242,103,.35) inset,0 0 22px rgba(30,242,103,.35),0 18px 30px rgba(0,0,0,.30)}.card.esito-entrata_persa{border-color:#ff554f;box-shadow:0 0 0 1px rgba(255,85,79,.30) inset,0 0 20px rgba(255,85,79,.24),0 18px 30px rgba(0,0,0,.30)}.card.esito-non_entrata{border-color:#ffd34f;box-shadow:0 0 0 1px rgba(255,211,79,.30) inset,0 0 20px rgba(255,211,79,.24),0 18px 30px rgba(0,0,0,.30)}
.card-head{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.league{font-weight:800;font-size:.86rem;line-height:1.1}.league small{display:block;color:#b7ad99;font-size:.6rem;text-transform:uppercase;letter-spacing:.13em;margin-bottom:5px}.time{padding:9px 11px;border-radius:14px;background:rgba(21,22,19,.88);border:1px solid rgba(255,255,255,.08);text-align:right;min-width:74px}.time small{display:block;font-size:.56rem;color:#958d7d;text-transform:uppercase;letter-spacing:.12em}.time strong{font-size:1rem}.date{position:relative;z-index:1;color:#938877;font-size:.68rem}
.matchup{position:relative;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 8px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.05)}.team{text-align:center}.role{font-size:.58rem;text-transform:uppercase;letter-spacing:.16em;color:#b7ad99;margin-bottom:8px}.crest-wrap{width:84px;height:84px;border-radius:18px;margin:0 auto 8px;display:grid;place-items:center;background:rgba(14,14,13,.82);border:1px solid rgba(255,255,255,.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}.crest{width:64px;height:64px;object-fit:contain}.crest.placeholder{display:grid;place-items:center;color:#d8c39b;font-weight:800;font-size:1rem}.team-name{font-size:.92rem;font-weight:800}.vs{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;font-weight:800;box-shadow:0 6px 14px rgba(216,173,61,.22)}
.info-grid{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid rgba(243,210,113,.55);margin-top:2px;padding-top:10px}.info{background:transparent;border:none;border-radius:0;padding:0 10px}.info + .info{border-left:1px solid rgba(243,210,113,.45)}.info label{font-size:.58rem;text-transform:uppercase;letter-spacing:.09em;color:#b7ad99}.info strong{display:block;margin-top:6px;font-size:1.08rem}.info.strategy strong{font-size:.9rem;line-height:1.22}
.status{position:relative;z-index:1;margin-top:auto;padding:10px 14px;border-radius:14px;text-transform:uppercase;border:1px solid;display:flex;align-items:center;justify-content:center;gap:12px;min-height:56px}.status-icon{font-size:1.7rem;line-height:1}.status-copy{display:flex;flex-direction:column;align-items:flex-start;line-height:1}.status-copy small{font-size:.55rem;letter-spacing:.18em;opacity:.95;margin-bottom:4px}.status-copy strong{font-size:1rem;letter-spacing:.02em}.status.entrata_vinta{color:#18ff63;background:linear-gradient(180deg,rgba(4,90,33,.90),rgba(7,71,28,.96));border-color:rgba(30,242,103,.92);box-shadow:inset 0 0 0 1px rgba(30,242,103,.22),0 0 18px rgba(30,242,103,.24)}.status.entrata_persa{color:#ffd9d8;background:linear-gradient(180deg,rgba(120,19,18,.92),rgba(94,13,12,.96));border-color:rgba(255,85,79,.92);box-shadow:inset 0 0 0 1px rgba(255,85,79,.18),0 0 16px rgba(255,85,79,.22)}.status.non_entrata{color:#ffe8a2;background:linear-gradient(180deg,rgba(112,87,14,.92),rgba(94,70,9,.96));border-color:rgba(255,211,79,.92);box-shadow:inset 0 0 0 1px rgba(255,211,79,.18),0 0 16px rgba(255,211,79,.20)}.status.attesa{color:#eef2f8;background:linear-gradient(180deg,rgba(58,63,74,.62),rgba(44,48,56,.74));border-color:rgba(170,177,188,.38)}.empty{grid-column:1/-1;text-align:center;color:#847b6b;padding:50px}
@media(max-width:900px){.page-shell{width:min(100vw - 16px,100vw - 16px);margin:8px auto 20px}.topbar{grid-template-columns:1fr auto;height:auto;padding:12px 16px}.nav{display:none}.hero img{height:240px;object-fit:cover}.section{padding:12px 14px 28px}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));justify-content:stretch}.nav-actions{gap:6px}.nav-btn{padding:9px 12px}}
@media(max-width:560px){body{background:#070707}.page-shell{width:100%;margin:0;border-radius:0}.brand-copy small{display:none}.nav-actions .nav-btn:first-child{display:none}.hero img{height:210px}.toolbar{justify-content:flex-start}.pills{width:100%}.pill{flex:1}.grid{grid-template-columns:1fr}.info-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="page-shell">
  <header class="topbar">
    <a href="/easybet.html" class="brand">
      <div class="brand-mark">EB</div>
      <div class="brand-copy"><strong>Easy<span>Bet</span></strong><small>PLAY SMARTER</small></div>
    </a>
    <nav class="nav">
      <a class="view-link active" data-view="home" href="#home">Home</a><a class="view-link" data-view="pronostici" href="#pronostici">Pronostici</a><a class="view-link" data-view="live" href="#live">Live</a><a href="#partite">Statistiche</a><a href="#partite">Strategie</a><a href="#partite">Consigli</a><a href="#">Blog</a>
    </nav>
    <div class="nav-actions"><a class="nav-btn" href="/easybet-admin.html">Accedi</a><a class="nav-btn primary" href="#partite">Registrati</a></div>
  </header>

  <section class="hero" aria-label="EasyBet Live Match Tracker">
    <img src="/assets/easybet-hero-banner.png" alt="EasyBet Live Match Tracker con stadio e logo">
  </section>

  <section class="section" id="partite">
    <div class="section-head">
      <div class="title-wrap"><span class="accent-line"></span><div><h2 id="sectionTitle">PARTITE TERMINATE</h2><p id="sectionSubtitle">RISULTATI E ESITI DELLE PARTITE CONCLUSE</p></div></div>
      <div class="refresh num" id="refreshNote">aggiornamento…</div>
    </div>
    <div class="toolbar" id="toolbar"><div class="pills" id="pills">
      <button class="pill active" data-f="tutte">Tutte</button>
      <button class="pill" data-f="entrata_vinta">● Vinte</button>
      <button class="pill" data-f="entrata_persa">● Perse</button>
      <button class="pill" data-f="non_entrata">● Non entrate</button>
      <button class="pill" data-f="">In attesa</button>
    </div></div>
    <div class="grid" id="grid"><div class="empty">Caricamento…</div></div>
  </section>
</div>
<script>
(function(){
  var ESITO_LABEL={entrata_vinta:'Entrati • Vinta',entrata_persa:'Entrati • Persa',non_entrata:'Non entrati'};var ESITO_ICON={entrata_vinta:'🏆',entrata_persa:'✖',non_entrata:'−'};
  var crestCache={},matches=[],currentFilter='tutte',currentView='home';
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function initials(name){var p=String(name||'').trim().split(/\s+/);return (((p[0]||'')[0]||'?')+((p[1]||'')[0]||'')).toUpperCase()}
  function crestImg(name,campionato){var id='crest-'+Math.random().toString(36).slice(2);setTimeout(function(){loadCrest(name,campionato,id)},0);return '<span class="crest-wrap"><span class="crest placeholder" id="'+id+'">'+esc(initials(name))+'</span></span>'}
  function loadCrest(name,campionato,id){if(!String(name||'').trim())return;var key=String(name||'').trim().toLowerCase()+'|'+String(campionato||'').trim().toLowerCase();if(crestCache[key]!==undefined){applyCrest(id,crestCache[key]);return}var url='/api/team-crest?name='+encodeURIComponent(name)+(campionato?'&country='+encodeURIComponent(campionato):'');fetch(url).then(r=>r.json()).then(function(d){crestCache[key]=d&&d.url?d.url:null;applyCrest(id,crestCache[key])}).catch(function(){crestCache[key]=null})}
  function applyCrest(id,url){var el=document.getElementById(id);if(!el||!url)return;var img=document.createElement('img');img.className='crest';img.src=url;img.alt='';el.replaceWith(img)}
  function dt(v){var d=new Date(Number(v));return isNaN(d.getTime())?null:d}
  function fmtDate(m){if(m.data)return m.data;var d=dt(m.startAt);return d?d.toLocaleDateString('it-IT'):'—'}
  function fmtTime(m){if(m.ora)return m.ora;var d=dt(m.startAt);return d?d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'—'}
  function isFinished(m){return !!String(m.esitoManuale||'').trim()}
  function isUpcoming(m){return !isFinished(m) && Number(m.startAt)>Date.now()}
  function isLive(m){return !isFinished(m) && Number(m.startAt)<=Date.now()}
  function matchesView(m){
    if(currentView==='pronostici') return isUpcoming(m);
    if(currentView==='live') return isLive(m);
    return isFinished(m);
  }
  function matchesOutcomeFilter(m){return currentFilter==='tutte'||(m.esitoManuale||'')===currentFilter}
  function updateViewUI(){
    var title=document.getElementById('sectionTitle'),sub=document.getElementById('sectionSubtitle'),toolbar=document.getElementById('toolbar');
    document.querySelectorAll('.view-link').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-view')===currentView)});
    if(currentView==='pronostici'){
      title.textContent='PRONOSTICI';
      sub.textContent='TUTTE LE PARTITE PROGRAMMATE PRIMA DEL CALCIO D’INIZIO';
      toolbar.style.display='none';
    }else if(currentView==='live'){
      title.textContent='LIVE';
      sub.textContent='PARTITE INIZIATE E ANCORA SENZA ESITO FINALE';
      toolbar.style.display='none';
    }else{
      title.textContent='PARTITE TERMINATE';
      sub.textContent='RISULTATI E ESITI DELLE PARTITE CONCLUSE';
      toolbar.style.display='flex';
    }
  }
  function render(){
    updateViewUI();
    var grid=document.getElementById('grid');
    var list=matches.filter(matchesView).filter(function(m){return currentView==='home'?matchesOutcomeFilter(m):true});
    if(!list.length){
      var empty=currentView==='pronostici'?'Nessun pronostico programmato.':currentView==='live'?'Nessuna partita live in questo momento.':'Nessuna partita terminata disponibile.';
      grid.innerHTML='<div class="empty">'+empty+'</div>';return;
    }
    grid.innerHTML=list.map(function(m){
      var e=m.esitoManuale||'',status=e?e:'attesa',camp=esc(m.campionato||'Campionato'),q=esc(m.quotaIngresso||'—'),str=esc(m.tipoGiocata||'Da definire');
      var icon,label;
      if(e){icon=ESITO_ICON[e];label=ESITO_LABEL[e]}
      else if(currentView==='live'){icon='●';label='Live'}
      else{icon='⏱';label='Da iniziare'}
      return '<article class="card'+(e?' esito-'+e:'')+'"><div class="card-head"><div class="league"><small>Campionato</small>'+camp+'</div><div class="time"><small>Ora</small><strong class="num">'+esc(fmtTime(m))+'</strong></div></div><div class="date num">'+esc(fmtDate(m))+'</div><div class="matchup"><div class="team"><div class="role">Casa</div>'+crestImg(m.casa,m.campionato)+'<div class="team-name">'+esc(m.casa||'Squadra casa')+'</div></div><div class="vs">VS</div><div class="team"><div class="role">Trasferta</div>'+crestImg(m.trasferta,m.campionato)+'<div class="team-name">'+esc(m.trasferta||'Squadra trasferta')+'</div></div></div><div class="info-grid"><div class="info"><label>Quota ingresso</label><strong class="num">'+q+'</strong></div><div class="info strategy"><label>Strategia</label><strong>'+str+'</strong></div></div><div class="status '+status+'"><span class="status-icon">'+icon+'</span><span class="status-copy"><small>'+ (e?'Esito':currentView==='live'?'Stato':'Stato') +'</small><strong>'+esc(label)+'</strong></span></div></article>'
    }).join('')
  }
  function load(){fetch('/api/state').then(r=>r.json()).then(function(s){matches=(s.matches||[]).slice().sort(function(a,b){return Number(a.startAt)-Number(b.startAt)});render();document.getElementById('refreshNote').textContent='aggiornato alle '+new Date().toLocaleTimeString('it-IT')}).catch(function(){document.getElementById('refreshNote').textContent='errore di aggiornamento'})}
  function setView(view,scroll){
    currentView=view||'home';currentFilter='tutte';
    document.querySelectorAll('.pill').forEach(function(p){p.classList.toggle('active',p.getAttribute('data-f')==='tutte')});
    render();
    if(scroll) document.getElementById('partite').scrollIntoView({behavior:'smooth',block:'start'});
  }
  document.querySelectorAll('.view-link').forEach(function(a){a.addEventListener('click',function(e){e.preventDefault();var v=a.getAttribute('data-view');history.replaceState(null,'','#'+v);setView(v,true)})});
  document.getElementById('pills').addEventListener('click',function(e){var b=e.target.closest('.pill');if(!b)return;currentFilter=b.getAttribute('data-f');document.querySelectorAll('.pill').forEach(function(p){p.classList.remove('active')});b.classList.add('active');render()});
  var initial=(location.hash||'#home').replace('#','');if(['home','pronostici','live'].indexOf(initial)<0)initial='home';currentView=initial;load();setInterval(load,15000);setInterval(function(){render()},30000)
})();
</script>
</body>
</html>
