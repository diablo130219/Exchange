<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBet — Esiti ingressi live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --surface:#12151B;
    --surface-2:#1A1E26;
    --border:#242932;
    --border-strong:#333A46;
    --text:#EDEFF3;
    --text-muted:#9AA1AF;
    --text-faint:#626976;
    --presa:#2ecc71; --presa-soft:#123425;
    --persa:#f1c40f; --persa-soft:#3a3013;
    --nonposs:#6b7280; --nonposs-soft:#23262c;
    --incorso:#4C8DFF; --incorso-soft:#16233F;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',ui-sans-serif,system-ui,sans-serif;padding:20px 16px 60px;}
  .wrap{max-width:820px;margin:0 auto;}
  header{margin-bottom:16px;}
  h1{font-size:1.3rem;margin:0;}
  .sub{color:var(--text-muted);font-size:.82rem;margin-top:4px;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .filter{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;padding:6px 13px;font-size:.78rem;font-weight:600;cursor:pointer;}
  .filter.active{background:var(--surface-2);border-color:var(--border-strong);color:var(--text);}
  .refresh-note{font-size:.72rem;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;margin-bottom:10px;}
  .slides{display:flex;flex-direction:column;gap:10px;}
  .slide{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .slide-main{flex:1;min-width:220px;}
  .slide-when{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:var(--text-faint);}
  .slide-teams{font-size:1rem;font-weight:700;margin:3px 0;}
  .slide-tipo{font-size:.82rem;color:var(--text-muted);}
  .slide-tipo b{color:var(--text);font-weight:600;}
  .slide-strategy{font-size:.68rem;color:var(--text-faint);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}
  .status{font-size:.76rem;font-weight:800;padding:7px 14px;border-radius:999px;white-space:nowrap;}
  .status.presa{background:var(--presa-soft);color:var(--presa);}
  .status.persa{background:var(--persa-soft);color:var(--persa);}
  .status.nonposs{background:var(--nonposs-soft);color:var(--nonposs);}
  .status.incorso{background:var(--incorso-soft);color:var(--incorso);}
  .empty{color:var(--text-faint);font-style:italic;padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📋 Esiti ingressi live — EasyBet</h1>
    <div class="sub">Presa / Persa / Non possibile entrare, calcolato in automatico dal sistema di segnali live.</div>
  </header>
  <div class="filters" id="filters">
    <span class="filter active" data-f="tutti">Tutti</span>
    <span class="filter" data-f="presa">🟢 Presa</span>
    <span class="filter" data-f="persa">🟡 Persa</span>
    <span class="filter" data-f="nonposs">⚪ Non possibile</span>
    <span class="filter" data-f="incorso">🔵 In corso</span>
  </div>
  <div class="refresh-note" id="refreshNote">aggiornamento…</div>
  <div class="slides" id="slides"><div class="empty">Caricamento…</div></div>
</div>

<script>
(function(){
  var STRATEGY_LABEL = {
    over05ht:'Over 0.5 HT', over15ft:'Over 1.5 FT', layx:'Lay X', backfav:'Back Favorita pre-gol'
  };
  var STATUS_LABEL = {
    presa: '🟢 Presa', persa: '🟡 Persa', nonposs: '⚪ Non possibile entrare', incorso: '🔵 In corso'
  };
  // Margine oltre il quale consideriamo la partita conclusa (90' + recuperi + intervallo, con margine di sicurezza)
  var MATCH_OVER_MS = 3 * 60 * 60 * 1000;
  var activeFilter = 'tutti';
  var lastMatches = [];

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function classify(m, now){
    if (!m.liveStrategy) return null;
    if (m.liveAlertSent) return 'presa';
    var over = now > (m.startAt + MATCH_OVER_MS);
    if (!over) return 'incorso';
    if (m.liveLastLevel === 'giallo') return 'persa';
    return 'nonposs';
  }

  function render(){
    var wrap = document.getElementById('slides');
    var now = Date.now();
    var rows = lastMatches
      .map(function(m){ return { m: m, status: classify(m, now) }; })
      .filter(function(r){ return r.status; })
      .filter(function(r){ return activeFilter === 'tutti' || r.status === activeFilter; });

    if (!rows.length){
      wrap.innerHTML = '<div class="empty">Nessuna partita con strategia live in questa categoria.</div>';
      return;
    }
    wrap.innerHTML = rows.map(function(r){
      var m = r.m;
      return '<div class="slide">'+
        '<div class="slide-main">'+
          '<div class="slide-when">'+esc(m.data)+' '+esc(m.ora)+(m.campionato? ' • '+esc(m.campionato):'')+'</div>'+
          '<div class="slide-teams">'+esc(m.casa)+' - '+esc(m.trasferta)+'</div>'+
          (m.tipoGiocata? '<div class="slide-tipo">👉 <b>'+esc(m.tipoGiocata)+'</b></div>' : '')+
          '<div class="slide-strategy">'+esc(STRATEGY_LABEL[m.liveStrategy]||m.liveStrategy)+'</div>'+
        '</div>'+
        '<div class="status '+r.status+'">'+STATUS_LABEL[r.status]+'</div>'+
      '</div>';
    }).join('');
  }

  function refresh(){
    fetch('/api/state').then(function(r){ return r.json(); }).then(function(s){
      lastMatches = s.matches || [];
      render();
      document.getElementById('refreshNote').textContent = 'aggiornato alle ' + new Date().toLocaleTimeString('it-IT');
    }).catch(function(){
      document.getElementById('refreshNote').textContent = 'errore di aggiornamento';
    });
  }

  document.getElementById('filters').addEventListener('click', function(e){
    var f = e.target.getAttribute('data-f');
    if (!f) return;
    activeFilter = f;
    Array.prototype.forEach.call(document.querySelectorAll('.filter'), function(el){
      el.classList.toggle('active', el.getAttribute('data-f') === f);
    });
    render();
  });

  refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
