<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyBet — Le mie partite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10;
    --surface:#12151B;
    --surface-2:#1A1E26;
    --border:#242932;
    --border-strong:#333A46;
    --text:#EDEFF3;
    --text-muted:#9AA1AF;
    --text-faint:#626976;
    --accent:#4C8DFF;
    --win:#2ecc71;
    --win-soft:#123425;
    --giallo:#f1c40f;
    --giallo-soft:#3a3013;
    --rosso:#e74c3c;
    --rosso-soft:#3a1a16;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -12px rgba(0,0,0,.65);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Sora',ui-sans-serif,system-ui,sans-serif;padding:20px 16px 60px;}
  .wrap{max-width:920px;margin:0 auto;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  h1{font-size:1.3rem;margin:0;}
  .sub{color:var(--text-muted);font-size:.82rem;margin-top:4px;}
  .refresh-note{font-size:.72rem;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;}
  .card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border-strong);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);}
  .card.level-verde{border-left-color:var(--win);}
  .card.level-giallo{border-left-color:var(--giallo);}
  .card.level-rosso{border-left-color:var(--rosso);}
  .card.sent{opacity:.6;}
  .card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .when{font-family:'IBM Plex Mono',monospace;font-size:.76rem;color:var(--text-muted);}
  .league{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);margin-top:2px;}
  .teams{font-size:1.05rem;font-weight:700;margin:8px 0 6px;}
  .tipo{font-size:.85rem;color:var(--text-muted);margin-bottom:10px;}
  .tipo b{color:var(--text);font-weight:600;}
  .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .badge{font-size:.7rem;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;}
  .badge.strategy{background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);font-weight:600;}
  .badge.verde{background:var(--win-soft);color:var(--win);}
  .badge.giallo{background:var(--giallo-soft);color:var(--giallo);}
  .badge.rosso{background:var(--rosso-soft);color:var(--rosso);}
  .badge.sent{background:var(--win-soft);color:var(--win);}
  .summary{font-size:.72rem;color:var(--text-faint);margin-top:6px;font-family:'IBM Plex Mono',monospace;}
  .empty{color:var(--text-faint);font-style:italic;padding:40px 0;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>⚡ Le mie partite — EasyBet</h1>
      <div class="sub">Stesso responso che ricevi su Telegram, qui in schede.</div>
    </div>
    <div class="refresh-note" id="refreshNote">aggiornamento…</div>
  </header>
  <div class="grid" id="grid"><div class="empty">Caricamento…</div></div>
</div>

<script>
(function(){
  var LEVEL_LABEL = {verde:'🟢 VERDE', giallo:'🟡 GIALLO', rosso:'🔴 ROSSO'};
  var STRATEGY_LABEL = {
    over05ht:'Over 0.5 HT', over15ft:'Over 1.5 FT', layx:'Lay X', backfav:'Back Favorita pre-gol'
  };

  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function fmtCountdown(ms){
    if (ms <= 0) return 'iniziata';
    var totalMin = Math.round(ms/60000);
    if (totalMin < 60) return 'tra ' + totalMin + ' min';
    var h = Math.floor(totalMin/60), m = totalMin%60;
    if (h < 24) return 'tra ' + h + 'h ' + (m? m+'m':'');
    return 'tra ' + Math.floor(h/24) + 'g';
  }

  function render(matches){
    var grid = document.getElementById('grid');
    if (!matches.length){
      grid.innerHTML = '<div class="empty">Nessuna partita caricata al momento.</div>';
      return;
    }
    var now = Date.now();
    grid.innerHTML = matches.map(function(m){
      var level = m.liveLastLevel || '';
      var cls = 'card' + (level ? ' level-'+level : '') + (m.notified ? ' sent' : '');
      var badges = '';
      if (m.liveStrategy){
        badges += '<span class="badge strategy">'+esc(STRATEGY_LABEL[m.liveStrategy]||m.liveStrategy)+'</span>';
        if (m.liveAlertSent){
          badges += '<span class="badge sent">🎉 Segnale inviato</span>';
        } else if (level){
          badges += '<span class="badge '+level+'">'+(LEVEL_LABEL[level]||level)+'</span>';
        } else {
          badges += '<span class="badge strategy">in attesa dati live</span>';
        }
      }
      var remaining = m.startAt - now;
      return '<div class="'+cls+'">'+
        '<div class="card-top">'+
          '<span class="when">'+esc(m.data)+' '+esc(m.ora)+'</span>'+
          '<span class="when">'+(m.notified?'avviso pre-match inviato':fmtCountdown(remaining))+'</span>'+
        '</div>'+
        (m.campionato? '<div class="league">'+esc(m.campionato)+'</div>' : '')+
        '<div class="teams">'+esc(m.casa)+' - '+esc(m.trasferta)+'</div>'+
        (m.tipoGiocata? '<div class="tipo">👉 <b>'+esc(m.tipoGiocata)+'</b></div>' : '')+
        '<div class="badges">'+badges+'</div>'+
        (m.liveLastSummary? '<div class="summary">'+esc(m.liveLastSummary)+'</div>' : '')+
      '</div>';
    }).join('');
  }

  function refresh(){
    fetch('/api/state').then(function(r){ return r.json(); }).then(function(s){
      render(s.matches || []);
      document.getElementById('refreshNote').textContent = 'aggiornato alle ' + new Date().toLocaleTimeString('it-IT');
    }).catch(function(){
      document.getElementById('refreshNote').textContent = 'errore di aggiornamento';
    });
  }

  refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
